note: >-
  The Park itself is free and needs no account; the A2A and MCP endpoints are anonymous. Paid offerings
  exist only for A2AParkBench and are transcribed from bench.a2apark.com, re-verified 2026-10-17 at the
  provider's request: a EUR 199/month Team feed with a live "Subscribe" checkout form (/api/checkout/team),
  and a separate one-time EUR 250 corpus pilot that "cannot be purchased until the named buyer and
  A2AParkBench agree the scope ... in writing". Prices exclude tax; no VAT is charged while the Dutch KOR
  applies. The page states "No annual, founding, add-on or tax subscription is included", so the annual
  and founding prices recorded on 2026-09-19 are withdrawn. Current availability is whatever
  bench.a2apark.com says.
