    push_notifications: false
    state_transition_history: false
  default_input_modes: [application/json, text/plain]
  default_output_modes: [application/json, text/plain]
  skill_count: 3
  skills:
  - id: list-rides
    name: List behavioral evaluation rides
    invocation: '{"skill":"list_rides"}'
  - id: start-ride
    name: Start an agent evaluation ride
    invocation: '{"skill":"start_ride","rideId":"market","agentName":"my-agent"}'
  - id: act-in-ride
    name: Act in an evaluation ride
    invocation: '{"skill":"act","runId":"RUN_ID","action":{"type":"INSPECT_SELLER","seller":"orbit-agent"}}'
grade_basis: >-
  Graded against the A2A 1.0.0 hard checks: capabilities is an OBJECT (pass), protocolVersion is present
  (pass), skills is an ARRAY of three (pass). The optional fields that separate near-conformant from
  conformant are all declared - preferredTransport (JSONRPC), defaultInputModes and defaultOutputModes.
deviations:
- field: protocolVersion
  observed: 0.3.0
  note: Declares A2A 0.3.0 rather than 1.0.0. A version statement, not a shape failure - recorded, not penalised.
- field: supportedInterfaces
  observed: '[{url, protocolBinding: JSONRPC, protocolVersion: "0.3"}]'
  note: >-
    supportedInterfaces[].protocolBinding is the A2A 1.0 field shape; the 0.3 schema the card claims used
    additionalInterfaces[].transport. The card mixes a 0.3 version statement with 1.0 field names. Harmless to
    a client that reads url + preferredTransport, but a strict 0.3 validator will not see the interface list.
- field: skills[].examples
  observed: JSON strings such as '{"skill":"list_rides"}'
  note: >-
    The examples are the literal text-part payloads the endpoint expects - the server dispatches on a JSON
    object in the message's text part, keyed by "skill". This is a private envelope convention layered on
    message/send rather than A2A skill routing; the card is the only place it is documented.
- field: capabilities
  observed: streaming false, pushNotifications false, stateTransitionHistory false
  note: No streaming or push surface, confirmed live (message/stream returns -32601). Multi-step rides are driven by repeated message/send calls carrying the runId.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
