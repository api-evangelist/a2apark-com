- aid: a2apark-com:a2aparkbench-team-feed-api
  name: A2AParkBench Team Feed API
  description: >-
    The licensing and feed surface behind the A2AParkBench runner: POST /api/license/activate exchanges a
    Lemon Squeezy licence key plus a repository name for one per-repository bearer token, and GET
    /api/feed/manifest serves the authenticated, SHA-256-verified Team feed manifest the runner and
    GitHub Action pull changing regression packs from. Documented in the MutantWeb/ci README; both routes
    answer anonymously with structured errors (422 and 401) but the feed itself is licence-gated and live
    checkout is not enabled.
  image: https://a2apark.com/favicon.ico
