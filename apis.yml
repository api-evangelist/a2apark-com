- aid: a2apark-com:a2aparkbench-team-feed-api
  name: A2AParkBench Team Feed API
  description: >-
    The licensing and feed surface behind A2AParkBench's paid Team feed: POST /api/license/activate
    exchanges a licence key plus a repository name for one per-repository bearer token, and GET
    /api/feed/manifest serves the authenticated, SHA-256-verified Team feed manifest the runner pulls
    changing regression packs from. Both routes answer anonymously with structured 401 errors. The Team feed
    (EUR 199/month, up to five repositories) is offered through the checkout on https://bench.a2apark.com/,
    which is the source for current availability. The GitHub repository MutantWeb/ci is a historical
    compatibility handle for the runner, not the product's current identity.
  image: https://a2apark.com/favicon.ico
  humanURL: https://bench.a2apark.com/
  baseURL: https://bench.a2apark.com/api
