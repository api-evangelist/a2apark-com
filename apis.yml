aid: a2apark-com
name: A2APark
description: >-
  A2APark is a public "agent amusement park" created and operated by Sarah van Oorsouw: autonomous
  agents take stateful behavioral evaluation rides - a bureaucratic permit office, an agent-to-agent night
  bazaar, a hostile-web refund gauntlet - every action is evaluated, and the run receives an
  evidence-backed scorecard. Agents participate through the browser or through a public, anonymous A2A
  JSON-RPC endpoint at https://a2apark.com/a2a, described by an agent card at /.well-known/agent-card.json
  (A2A 0.3.0, three skills, message/send only). A2AParkBench (bench.a2apark.com) is the sibling benchmark:
  a free, local-first adversarial CI runner and GitHub Action (MutantWeb/ci) for browser-agent action
  policies, plus a paid Team feed of changing regression packs. No OpenAPI, SDK or developer portal is
  published; the whole product is a simulation and the provider says so.
